<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EECE Excellence Awards 2026 — Keynote · Engr. Raymond Cruzin</title>
<style>
  :root{
    --red:#A4123F;        /* Mapúa cardinal */
    --red-soft:#C7355F;
    --ink:#1c1c22;
    --muted:#6a6a76;
    --bg:#ffffff;
    --bg-2:#fdf4f6;       /* faint red wash */
    --line:#ececef;
    --maxw:1340px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }

  /* progress bar */
  #progress{position:fixed;top:0;left:0;height:4px;background:var(--red);width:0;z-index:50;transition:width .25s ease}

  /* deck */
  #deck{height:100vh;width:100vw;position:relative}
  .slide{
    position:absolute;inset:0;display:none;
    flex-direction:column;justify-content:center;
    padding:clamp(5vh,7vh,9vh) clamp(6vw,7vw,9vw);
  }
  .slide.active{display:flex;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* editorial: content anchored left, wide measure, generous rhythm */
  .inner{max-width:var(--maxw);width:100%;margin:0;display:flex;flex-direction:column;gap:.15em}

  /* typography */
  .slide h1{font-size:clamp(2.6rem,6vw,4.8rem);line-height:1.04;letter-spacing:-.025em;margin:.08em 0;font-weight:800}
  /* kicker with a short red rule for editorial polish */
  .slide h2{font-size:clamp(1rem,1.7vw,1.4rem);color:var(--red);text-transform:uppercase;letter-spacing:.16em;font-weight:800;margin:0 0 .6em;display:flex;align-items:center;gap:.7em}
  .slide h2::before{content:"";width:clamp(28px,3vw,52px);height:3px;background:var(--red);border-radius:2px;flex:none}
  .slide h3{font-size:clamp(1.5rem,3.2vw,2.3rem);font-weight:700;line-height:1.14;margin:.08em 0}
  .slide h4{font-size:clamp(1.15rem,2vw,1.6rem);font-weight:500;color:var(--muted);margin:.35em 0}
  .slide p{font-size:clamp(1.1rem,2vw,1.55rem);line-height:1.5;margin:.5em 0;max-width:54ch}
  .slide ul{list-style:none;margin:.5em 0}
  .slide li{font-size:clamp(1.1rem,2vw,1.6rem);line-height:1.5;margin:.5em 0;padding-left:0;max-width:56ch}
  .slide strong{color:var(--red)}
  .slide em{font-style:italic;color:var(--ink)}
  .slide blockquote{border:0;margin:0}
  .slide blockquote h1,.slide blockquote h2,.slide blockquote h3{color:var(--ink)}

  /* slide variants (driven by <!-- class: x --> in md) */
  /* title slides are top-anchored so a build (same headline, more lines on the next slide)
     keeps the kicker + headline pinned in place instead of re-centering and "jumping" */
  .slide.title{justify-content:flex-start;padding-top:clamp(14vh,18vh,22vh)}
  .slide.title .inner{border-left:8px solid var(--red);padding-left:clamp(1rem,3vw,2.5rem)}
  .slide.title h1{font-size:clamp(2.6rem,7vw,5.5rem)}
  /* title subtitle lines read as a tight, line-by-line stanza */
  .slide.title h4{margin:.12em 0;line-height:1.3}
  .slide.title h4:first-of-type{margin-top:.5em}
  .slide.title h4 + p{margin-top:.9em}
  /* small brand logo under a byline */
  .byline-logo{margin-top:.6em}
  .byline-logo img{height:clamp(3.4em,6vw,5em);width:auto;object-fit:contain}
  /* ALL slides white — red used only as text/accent */
  .slide.statement{background:#fff}
  .slide.statement .inner{text-align:left}
  .slide.statement h1{font-size:clamp(2.6rem,6.2vw,5rem)}
  /* statement h2 is a sub-line, not a kicker — drop the rule, reset to normal flow */
  .slide.statement h2{font-size:clamp(1.4rem,2.8vw,2.2rem);color:var(--red);text-transform:none;letter-spacing:0;font-weight:700;margin:.35em 0 0;display:block}
  .slide.statement h2::before{display:none}
  .slide.section{background:#fff;color:var(--ink)}
  .slide.section h1{color:var(--ink);font-size:clamp(2.6rem,7vw,5rem)}
  .slide.section h2,.slide.section h3{color:var(--red);text-transform:none;letter-spacing:0}
  .slide.section h2::before{background:var(--red)}
  .slide.section strong{color:var(--red)}
  /* section-dark now also white — kept as its own class for the 'elephant' slides */
  .slide.section-dark{background:#fff;color:var(--ink)}
  .slide.section-dark h1{color:var(--ink);font-size:clamp(2.4rem,6vw,4.4rem)}
  .slide.section-dark h2{color:var(--red);text-transform:uppercase;letter-spacing:.14em}
  .slide.section-dark h2::before{background:var(--red)}
  .slide.section-dark p{color:var(--ink)}
  .slide.section-dark strong{color:var(--red)}
  .slide.section-dark em{color:var(--ink)}
  .slide.section-dark .news .card{background:#fff;border-color:var(--line);border-left-color:var(--red);box-shadow:0 4px 16px rgba(20,20,40,.07)}
  .slide.section-dark .news .card .tag{color:var(--red)}
  .slide.section-dark .news .card b{color:var(--ink)}
  .slide.section-dark .news .card .sub{color:var(--muted)}
  /* authority slide — two laureate cards with real bullets */
  .slide.authority .inner{gap:.2em}
  .slide.authority h1{font-size:clamp(1.9rem,4vw,3rem);line-height:1.08}
  .slide.authority h3{font-weight:700;color:var(--ink);font-style:normal;margin-top:.3em}
  .slide.authority h3 strong{color:var(--red)}
  .people{display:flex;gap:clamp(1rem,3vw,2.2rem);margin:.7em 0 .3em;flex-wrap:wrap}
  .person{flex:1 1 0;min-width:240px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--red);
    border-radius:12px;padding:1em 1.2em;box-shadow:0 4px 16px rgba(20,20,40,.06)}
  .person .who{margin-bottom:.5em}
  .person .who b{display:block;font-size:clamp(1.15rem,2.1vw,1.55rem);color:var(--ink);line-height:1.1}
  .person .who span{font-size:clamp(.72rem,1.2vw,.92rem);color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .person ul{list-style:none;margin:.2em 0;display:flex;flex-direction:column;gap:.3em}
  .person li{font-size:clamp(.92rem,1.55vw,1.2rem);line-height:1.3;margin:0;padding-left:1.1em;position:relative;max-width:none}
  .person li::before{content:"▸";position:absolute;left:0;color:var(--red);font-weight:700}
  .person li b{color:var(--red)}

  /* MOAT reveal slide: huge spaced letters (white bg, red letters) */
  .slide.moatslide h1{font-size:clamp(3.5rem,11vw,9rem);letter-spacing:.08em;font-weight:800;color:var(--red)}
  .slide.moatslide h3{color:var(--ink);font-style:normal;font-weight:600;margin-top:.1em}
  .slide.moatslide h3 strong{color:var(--red)}
  .slide.quote{background:#fff}
  .slide.quote blockquote{position:relative;padding-left:clamp(1.2rem,4vw,3rem)}
  .slide.quote blockquote::before{content:"\201C";position:absolute;left:-.1em;top:-.35em;font-size:clamp(5rem,14vw,11rem);color:var(--red);opacity:.18;font-family:Georgia,serif;line-height:1}
  .slide.quote h1,.slide.quote h2,.slide.quote h3{font-style:italic}
  .slide.quote p{margin-top:1em;font-style:normal;color:var(--muted);font-size:clamp(1rem,1.9vw,1.3rem)}
  .slide.quote strong{color:var(--red)}
  .slide.principle h1{font-size:clamp(2.2rem,5.2vw,4rem)}
  .slide.principle h2{color:var(--red)}
  .slide.closing{background:#fff;color:var(--ink)}
  .slide.closing .inner{align-items:center;text-align:center;margin:0 auto}
  .slide.closing h1{color:var(--red)}
  .slide.closing h2{color:var(--red);text-transform:none;letter-spacing:0}
  .slide.closing h2::before{display:none}
  .slide.closing strong{color:var(--red)}
  .slide.closing em{color:var(--ink)}
  .slide.closing a{color:var(--red);text-decoration:underline}
  /* closing final note — the charge + scripture */
  /* closing slide is content-dense (headline + subtitle + QR + charge + verse):
     keep it compact so nothing clips the top kicker or runs under the footer */
  .slide.closing h4{margin:.2em 0}
  .slide.closing .qrcard{margin:.2em 0;padding:clamp(.6rem,1.4vh,1rem)}
  .slide.closing .qrcard img{width:clamp(110px,13vw,150px)}
  .slide.closing .final-note{margin-top:clamp(.3rem,1vh,.7rem);max-width:64ch;border-top:1px solid var(--line);padding-top:clamp(.4rem,1vh,.7rem)}
  .slide.closing .final-note .charge{font-size:clamp(1.1rem,2vw,1.5rem);font-weight:700;color:var(--ink);margin:0 0 .35em;line-height:1.2}
  .slide.closing .final-note .charge strong{color:var(--red)}
  .slide.closing .final-note .verse{font-size:clamp(.82rem,1.35vw,1.05rem);font-style:italic;color:var(--muted);line-height:1.42;max-width:62ch;margin:0 auto}
  .slide.closing .final-note .verse cite{display:block;font-style:normal;font-weight:700;color:var(--red);margin-top:.35em;font-size:.86em}
  /* brand slide — a single large centered logo + caption (e.g. Analog Devices) */
  .slide.brandslide .inner{align-items:center;text-align:center;margin:0 auto;gap:.4em}
  .slide.brandslide .brand-hero{width:clamp(220px,28vw,420px);height:auto;margin-bottom:.5em;border-radius:14px}
  .slide.brandslide h1{font-size:clamp(2.4rem,6vw,4.6rem)}
  .slide.brandslide h4{color:var(--muted);font-weight:500;margin:.2em 0;font-size:clamp(1.15rem,2.2vw,1.7rem)}
  .slide.brandslide h4 strong{color:var(--red)}

  /* slide corner logo (e.g. EECE crest on the timeline slide) */
  .slide-logo{position:absolute;top:clamp(3vh,5vh,6vh);right:clamp(4vw,6vw,8vw);
    width:clamp(150px,18vw,240px);height:auto;opacity:1;z-index:5}

  /* inline brand logos (drop real PNGs into images/logos/) */
  .logo{height:clamp(1.4em,2.4vw,1.9em);width:auto;vertical-align:middle;object-fit:contain;border-radius:6px}
  .news .card .logo{height:clamp(1.6em,2.6vw,2.1em);margin-bottom:.15em}
  .gtitle .logo{height:clamp(1.2em,2vw,1.6em);margin-right:.1em}
  .person .who .logo{height:clamp(1.5em,2.4vw,2em);margin-bottom:.25em;display:block}
  /* a row of institution logos (timeline) */
  .logorow{display:flex;align-items:center;gap:1.6em;margin-top:1.1em}
  .logorow img{height:clamp(4em,7vw,6em);width:auto;object-fit:contain}
  .logorow.center{justify-content:center;width:100%}
  .logorow.big{gap:clamp(2em,4vw,3.5em);margin-top:1.4em}
  .logorow.big img{height:clamp(6em,12vw,10em)}
  /* content-dense background slide: keep the photo modest so the slide fits the frame */
  .logorow.bg-photo{margin-top:clamp(.6em,1.6vh,1.1em)}
  .logorow.bg-photo img{height:clamp(4.5em,8vw,7em)}
  /* large centered hero artwork inside a slide body (e.g. the elephant) */
  .hero-art{display:block;margin:clamp(1rem,3vh,2.4rem) auto 0;width:auto;
    max-width:min(62%,680px);max-height:48vh;height:auto;object-fit:contain}
  /* small logo inside a journey caption */
  .cap-logo{height:1.3em;margin-right:.15em;border-radius:4px;vertical-align:-0.25em}
  /* decorative corner artwork (e.g. the baby-elephant on the 'other elephant' slide) */
  .corner-art{position:absolute;top:clamp(3vh,5vh,7vh);right:clamp(3vw,5vw,7vw);
    width:clamp(120px,16vw,230px);height:auto;opacity:.92;z-index:4;pointer-events:none}

  /* on-slide source citation — small, unobtrusive, pinned bottom-left */
  .src{position:absolute;left:clamp(6vw,7vw,9vw);bottom:clamp(2.4vh,3vh,3.6vh);
    font-size:clamp(.62rem,1vw,.82rem);color:var(--muted);max-width:80vw;line-height:1.35;font-style:normal}
  .src b{color:var(--red);font-weight:700}

  /* value chips (Mapúa core values) */
  .chips{display:flex;flex-wrap:wrap;gap:.6em;margin:.7em 0}
  .chips span{display:inline-block;padding:.4em .95em;border-radius:999px;
    background:var(--bg-2);color:var(--red);border:1.5px solid var(--red);
    font-weight:700;font-size:clamp(.95rem,1.9vw,1.4rem);letter-spacing:.01em}

  /* generic centered-image slide (e.g. the LinkedIn 'endgame' gag) */
  .slide.imageslide{padding:3vh 5vw}
  .slide.imageslide .inner{max-width:none;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em}
  .slide.imageslide h2{text-align:center}
  .full-img{max-height:78vh;max-width:90vw;width:auto;height:auto;object-fit:contain;
    border-radius:14px;box-shadow:0 10px 40px rgba(20,20,40,.18);background:#fff}

  /* news-headline cards (the fear / layoffs slide) */
  .slide.newscards .inner{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.5em}
  .slide.newscards h1{margin:0}
  .news{display:flex;flex-wrap:wrap;gap:.8em;margin:.8em 0}
  .news .card{flex:1 1 0;min-width:170px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);
    border-radius:10px;padding:.8em 1em;display:flex;flex-direction:column;gap:.25em;box-shadow:0 4px 16px rgba(20,20,40,.07)}
  .news .card .tag{font-size:clamp(.6rem,1vw,.78rem);font-weight:800;letter-spacing:.12em;color:var(--red);text-transform:uppercase}
  .news .card b{font-size:clamp(1.05rem,2.1vw,1.55rem);line-height:1.1;color:var(--ink)}
  .news .card .sub{font-size:clamp(.8rem,1.4vw,1.05rem);color:var(--muted);line-height:1.25}
  .news .card.big{background:var(--red);border-left-color:var(--red)}
  .news .card.big .tag{color:#ffd9e3}
  .news .card.big b{color:#fff;font-size:clamp(1.6rem,3.2vw,2.6rem);font-weight:800}
  .news .card.big .sub{color:#ffe7ee}

  /* QR placeholder */
  .qr{display:inline-block;margin:.6em 0;padding:1.1em 1.4em;border:2px dashed rgba(255,255,255,.7);border-radius:14px;font-family:ui-monospace,Menlo,monospace;font-size:1rem;color:#fff}

  /* real QR — white card so it scans on the red closing slide */
  .qrcard{display:inline-flex;flex-direction:column;align-items:center;gap:.5em;background:#fff;
    padding:1em 1em .8em;border-radius:16px;margin:.7em 0;border:1px solid var(--line);box-shadow:0 6px 22px rgba(20,20,40,.1)}
  .qrcard img{width:clamp(130px,16vw,190px);height:auto;display:block;image-rendering:pixelated}
  .qrcard span{font-family:ui-monospace,Menlo,monospace;font-size:clamp(.7rem,1.3vw,.95rem);color:var(--red);font-weight:600}
  /* light variant — inline QR card on a white slide (e.g. the Pokédex demo), sits WITH the text */
  .qrcard.light{align-self:flex-start;flex-direction:row;align-items:center;gap:1em;
    border:1px solid var(--line);box-shadow:0 6px 22px rgba(20,20,40,.08);padding:.8em 1.1em .8em .8em;margin:1em 0 0}
  .qrcard.light img{width:clamp(86px,9vw,116px)}
  .qrcard.light span{font-size:clamp(.75rem,1.3vw,1rem);max-width:11ch;text-align:left}

  /* code/moat slide — white bg; the formula in a light code box */
  .slide.code{background:#fff;color:var(--ink)}
  .slide.code h1{color:var(--ink)}
  .slide.code h2{color:var(--red);text-transform:none;letter-spacing:0;font-size:clamp(1.2rem,2.4vw,1.8rem)}
  .slide.code p{color:var(--ink)}
  .slide.code strong{color:var(--red)}
  .slide.code em{color:var(--muted)}
  .bigcode{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:600;
    font-size:clamp(2rem,7vw,5rem);color:var(--red);background:var(--bg-2);border:1px solid var(--line);
    border-radius:12px;padding:.4em .6em;margin:.5em 0;letter-spacing:.04em;white-space:pre;overflow-x:auto}

  /* journey slide — click-through images 1..5, fit to screen */
  /* only the ACTIVE journey slide ever shows its content (defends against bleed-through) */
  .slide:not(.active) .journey{display:none !important}
  .slide.journey{padding:2vh 4vw;justify-content:center;align-items:center}
  .slide.journey .inner{max-width:none;width:100%;height:100%;flex:1;display:grid;place-items:center}
  /* all steps stack in one grid cell so they cross-fade in place */
  .journey{display:grid;width:100%;height:100%}
  /* hidden steps are display:none (removed from layout, no bleed); shown step is a centered flex column */
  .journey .jstep{grid-area:1/1;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:1.2rem;margin:0;height:100%}
  .journey .jstep.show{display:flex}
  .journey .jstep img{max-width:92vw;max-height:74vh;width:auto;height:auto;object-fit:contain;
    border-radius:14px;box-shadow:0 10px 40px rgba(20,20,40,.18)}
  .journey figcaption{font-size:clamp(1rem,2.1vw,1.5rem);color:var(--ink);text-align:center;max-width:60ch;line-height:1.4}
  .journey figcaption b{color:var(--red)}
  .journey figcaption i{color:var(--muted);font-style:italic}
  .jdots{grid-area:1/1;align-self:end;justify-self:center;margin-bottom:.4rem;display:flex;gap:.6rem;z-index:6}
  .jdots span{width:11px;height:11px;border-radius:50%;background:#e1c4cd;transition:background .3s,transform .3s}
  .jdots span.on{background:var(--red);transform:scale(1.25)}
  .jdots span.done{background:var(--red-soft)}

  /* chart slides: lay out headline / chart / caption as separate rows so nothing overlaps */
  .slide.chartslide .inner{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.4em}
  .slide.chartslide h1{margin:0}

  /* inline bar chart — flow-based (value / fill / year), labels never escape */
  .chart{display:flex;align-items:flex-end;gap:clamp(1.2rem,4vw,3rem);height:clamp(150px,30vh,280px);margin:.5em 0;padding:0 .2em}
  .chart .bar{flex:1;max-width:160px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.35em}
  .chart .bv{font-weight:800;color:var(--ink);font-size:clamp(1.05rem,2.1vw,1.6rem);line-height:1}
  .chart .fill{display:block;width:100%;height:var(--h);background:#e7c2cd;border-radius:8px 8px 0 0;transition:height .5s ease}
  .chart .bl{font-weight:700;color:var(--muted);font-size:clamp(.85rem,1.6vw,1.15rem);line-height:1}
  .chart .bar:last-child .bv{color:var(--red)}

  /* twin growth charts (slide: the labs are racing) */
  .slide.twincharts .inner{display:flex;flex-direction:column;justify-content:center;height:100%;gap:.5em}
  .slide.twincharts h1{margin:0}
  .twin{display:flex;gap:clamp(1.5rem,5vw,4rem);justify-content:center;align-items:flex-end;margin:.3em 0}
  .growth{flex:1;max-width:420px;display:flex;flex-direction:column;gap:.5em}
  .gtitle{font-weight:700;color:var(--ink);font-size:clamp(.95rem,1.8vw,1.3rem);text-align:center}
  .growth .chart{height:clamp(120px,24vh,220px);gap:clamp(.6rem,2vw,1.4rem);margin:0}
  .growth .chart .bv{font-size:clamp(.8rem,1.5vw,1.15rem)}
  .growth .chart .bl{font-size:clamp(.7rem,1.2vw,.95rem)}

  /* footer */
  #footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:.55rem 1.2rem;font-size:.8rem;color:var(--muted);z-index:40;pointer-events:none}
  #footer .lhs{font-weight:600;color:var(--red)}
  /* deck-wide corner crest — small, every slide, bottom-right above the counter */
  #brand-logo{position:fixed;right:clamp(.9rem,1.6vw,1.6rem);bottom:clamp(2.4rem,4vh,3.2rem);
    width:clamp(40px,4.5vw,64px);height:auto;opacity:.85;z-index:41;pointer-events:none}
  body.has-slide-logo #brand-logo{display:none} /* avoid double crest on slides with their own */
  @media print{#brand-logo{position:absolute}}

  /* speaker notes */
  #notes{position:fixed;bottom:0;left:0;right:0;max-height:38vh;overflow:auto;
    background:#1c1c22;color:#f4f4f6;padding:1.1rem 1.4rem 1.6rem;
    font-size:1rem;line-height:1.5;display:none;z-index:60;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  #notes.show{display:block}
  #notes .tag{display:inline-block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#ff8fb0;margin-bottom:.4rem;font-weight:700}
  #notes strong{color:#ffb3c8}

  /* help hint */
  #hint{position:fixed;bottom:.5rem;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--muted);z-index:41;opacity:.8;pointer-events:none}

  /* click zones */
  .nav-zone{position:fixed;top:0;bottom:0;width:18vw;z-index:30;cursor:pointer}
  #zone-prev{left:0}
  #zone-next{right:0;width:30vw}

  @media print{
    body:not(.overview) .slide{display:flex !important;position:relative;page-break-after:always;height:100vh}
    body:not(.overview) #footer,body:not(.overview) #hint,#notes,.nav-zone,#progress{display:none}
  }

  /* ===== OVERVIEW MODE (contact sheet + speaker notes) — toggle with 'o' or #overview ===== */
  #overview{display:none}

/* ---------- tiny markdown -> slide renderer ---------- */
function inline(t){
  return t
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    // restore intentional html (qr div) — we re-inject below, so guard it
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+?)\*/g,"$1<em>$2</em>")
    .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');
}

function parseSlide(raw){
  const notesMatch = raw.match(/<!--\s*notes:\s*([\s\S]*?)-->/i);
  const notes = notesMatch ? notesMatch[1].trim() : "";
  const classMatch = raw.match(/<!--\s*class:\s*([\w-]+)\s*-->/i);
  const cls = classMatch ? classMatch[1].trim() : "";

  let body = raw
    .replace(/<!--\s*notes:[\s\S]*?-->/i,"")
    .replace(/<!--\s*class:[\s\S]*?-->/i,"")
    .trim();

  const lines = body.split("\n");
  let html = "", ulOpen = false, raw_html_block = "";
  const closeUl = ()=>{ if(ulOpen){ html+="</ul>"; ulOpen=false; } };

  for(let line of lines){
    const l = line.trim();
    if(!l){ continue; }
    if(l.startsWith("<")){ closeUl(); html+=l; continue; }  /* pass raw HTML lines (div/img/figure/pre/span...) through verbatim */
    let m;
    if((m=l.match(/^####\s+(.*)/))){ closeUl(); html+=`<h4>${inline(m[1])}</h4>`; }
    else if((m=l.match(/^###\s+(.*)/))){ closeUl(); html+=`<h3>${inline(m[1])}</h3>`; }
    else if((m=l.match(/^##\s+(.*)/))){ closeUl(); html+=`<h2>${inline(m[1])}</h2>`; }
    else if((m=l.match(/^#\s+(.*)/))){ closeUl(); html+=`<h1>${inline(m[1])}</h1>`; }
    else if((m=l.match(/^[-*]\s+(.*)/))){ if(!ulOpen){html+="<ul>";ulOpen=true;} html+=`<li>${inline(m[1])}</li>`; }
    else { closeUl(); html+=`<p>${inline(l)}</p>`; }
  }
  closeUl();
  return {cls, notes, html};
}

const rawSlides = MD.split(/\n-{3,}\n/).map(s=>s.trim()).filter(Boolean);
const slides = rawSlides.map(parseSlide);

const deck = document.getElementById("deck");
slides.forEach((s,i)=>{
  const el = document.createElement("section");
  el.className = "slide" + (s.cls ? " "+s.cls : "");
  el.innerHTML = `<div class="inner">${s.html}</div>`;
  deck.appendChild(el);
});

const slideEls = [...document.querySelectorAll(".slide")];
let cur = 0, notesOn = false;
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const notesBox = document.getElementById("notes");

// --- within-slide image stepping (journey slide) ---
function journeyEl(i){ return slideEls[i].querySelector(".journey"); }
function isJourney(i){ return !!journeyEl(i); }
function journeyCount(i){ const j=journeyEl(i); return j? +(j.dataset.steps||j.querySelectorAll(".jstep").length):0; }
let jstep = 0; // 1-based index of revealed image on current journey slide (0 = none yet)
function paintJourney(){
  const j = journeyEl(cur); if(!j) return;
  j.querySelectorAll(".jstep").forEach(f=>f.classList.toggle("show", +f.dataset.step===jstep));
  const dots = j.querySelectorAll(".jdots span");
  dots.forEach((d,k)=>{ d.classList.toggle("on",k+1===jstep); d.classList.toggle("done",k+1<jstep); });
}

function render(){
  slideEls.forEach((el,i)=>el.classList.toggle("active", i===cur));
  document.body.classList.toggle("has-slide-logo", !!slideEls[cur].querySelector(".slide-logo"));
  counter.textContent = `${cur+1} / ${slideEls.length}`;
  progress.style.width = ((cur)/(slideEls.length-1)*100)+"%";
  const n = slides[cur].notes;
  notesBox.innerHTML = n
    ? `<span class="tag">Speaker notes — slide ${cur+1}</span><div>${inline(n)}</div>`
    : `<span class="tag">Speaker notes — slide ${cur+1}</span><div><em>(no notes)</em></div>`;
  if(isJourney(cur)) paintJourney();
  location.hash = cur+1;
}
function go(n, jstart){
  cur = Math.max(0, Math.min(slideEls.length-1, n));
  if(isJourney(cur)) jstep = (jstart==="end") ? journeyCount(cur) : 1; // forward → first image; backward → last
  render();
}
function next(){
  if(isJourney(cur) && jstep < journeyCount(cur)){ jstep++; paintJourney(); return; }
  go(cur+1);
}
function prev(){
  if(isJourney(cur) && jstep > 1){ jstep--; paintJourney(); return; }
  go(cur-1, "end");
}

document.addEventListener("keydown",e=>{
  switch(e.key){
    case "ArrowRight": case " ": case "PageDown": e.preventDefault(); next(); break;
    case "ArrowLeft": case "PageUp": e.preventDefault(); prev(); break;
    case "Home": go(0); break;
    case "End": go(slideEls.length-1); break;
    case "s": case "S": notesOn=!notesOn; notesBox.classList.toggle("show",notesOn); break;
    case "f": case "F":
      if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
      break;
  }
});
document.getElementById("zone-next").addEventListener("click",next);
document.getElementById("zone-prev").addEventListener("click",prev);

/* ---------- OVERVIEW MODE: all slides as cards + speaker notes ---------- */
const REF_W = 1280, REF_H = 720; // reference slide canvas the cards scale from
const ovRoot = document.getElementById("overview");
let ovBuilt = false;

function buildOverview(){
  if(ovBuilt) return;
  ovRoot.innerHTML = `
    <div class="ov-head">
      <div class="kicker">Full deck overview · ${slides.length} slides</div>
      <h1>EECE Excellence Awards 2026 — Keynote</h1>
      <p>Every slide on one page with speaker notes, for review. Press <b>o</b> (or Esc) to return to presenting.</p>
      <div class="ov-toolbar">
        <button id="ov-back">▶ Back to presenting</button>
        <button id="ov-notes-toggle">Toggle notes</button>
        <button id="ov-print">Print / PDF</button>
      </div>
    </div>
    <div class="rows" id="ov-rows"></div>`;
  const rows = ovRoot.querySelector("#ov-rows");
  slides.forEach((s,i)=>{
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="slidewrap">
        <span class="ov-badge">${i+1}</span>
        <div class="ov-card">
          <section class="slide${s.cls?" "+s.cls:""} active" style="width:${REF_W}px;height:${REF_H}px">
            <div class="inner">${s.html}</div>
          </section>
        </div>
      </div>
      <div class="ov-notes">
        <span class="tag">Speaker notes — slide ${i+1}</span>
        ${s.notes?`<div>${inline(s.notes)}</div>`:`<p class="none">(no notes)</p>`}
      </div>`;
    rows.appendChild(row);
  });
  // reveal all journey steps in the static overview
  rows.querySelectorAll(".journey .jstep").forEach(f=>f.classList.add("show"));
  ovRoot.querySelector("#ov-back").addEventListener("click",()=>setOverview(false));
  ovRoot.querySelector("#ov-print").addEventListener("click",()=>window.print());
  ovRoot.querySelector("#ov-notes-toggle").addEventListener("click",()=>ovRoot.classList.toggle("no-notes"));
  ovBuilt = true;
  requestAnimationFrame(scaleOverviewCards);
}

function scaleOverviewCards(){
  ovRoot.querySelectorAll(".ov-card").forEach(card=>{
    const w = card.clientWidth;
    const sc = w / REF_W;
    const slide = card.querySelector(".slide");
    slide.style.transformOrigin = "top left";
    slide.style.transform = `scale(${sc})`;
    slide.style.width = REF_W+"px";
    slide.style.height = REF_H+"px";
  });
}

function setOverview(on){
  document.body.classList.toggle("overview", on);
  if(on){ buildOverview(); requestAnimationFrame(scaleOverviewCards);
    if(location.hash!=="#overview") history.replaceState(null,"","#overview");
  } else {
    history.replaceState(null,"","#"+(cur+1));
    render();
  }
}
window.addEventListener("resize",()=>{ if(document.body.classList.contains("overview")) scaleOverviewCards(); });

// extend keyboard: 'o' toggles overview, Esc exits it
document.addEventListener("keydown",e=>{
  if(e.key==="o"||e.key==="O"){ setOverview(!document.body.classList.contains("overview")); }
  else if(e.key==="Escape" && document.body.classList.contains("overview")){ setOverview(false); }
});

// deep-link: #overview opens overview; #n opens slide n
if(location.hash==="#overview"){
  go(0); setOverview(true);
} else {
  const start = parseInt(location.hash.replace("#",""))||1;
  go(start-1);
}
